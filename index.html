        }

        #phone #sifre #tuslar button {
            font-size: 30px !important;

            line-height: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
        }

            #phone #sifre #tuslar button::after {
                display: block;
                font-size: 10px;
                font-weight: 500;

                line-height: 1;
                margin-top: 3px;
                padding-left: 2px;
                content: "\00a0";
            }

                content: "ABC";
            }

            #phone #sifre #tuslar button[data-t="3"]::after {

            }

            }

        }

        }

            }

        }

        .p-zaman {
            opacity: .55;
            display: block;

        }

        .tk-baslik {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
        }

            .tk-baslik button {
                background: none;
                border: 0;
                color: inherit;
                font-size: 26px;
                padding: 0 10px;
                cursor: pointer;
            }

            .tk-baslik b {
                text-transform: capitalize;
                font-size: 18px;
            }

            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px 0;
            padding: 0 12px 12px;
            text-align: center;
        }

            .tk-izgara small {
                opacity: .55;
                font-size: 12px;
                padding-bottom: 4px;
            }

        .gun {
            position: relative;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

                background: #ff3b30;
                color: #fff;
                border-radius: 50%;
                width: 38px;
                margin: 0 auto;
            }

                position: absolute;
                bottom: 1px;
                left: 50%;
                width: 5px;
                height: 5px;
                margin-left: -2.5px;
                border-radius: 50%;
                background: #8e8e93;
            }

                background: #fff;
            }

            border-top: 1px solid rgba(128,128,128,.25);

                                        // ===== CANLI HAVA DURUMU (Seul) =====
                                        const SEUL = { enlem: 37.5665, boylam: 126.9780 };

                                        function havaYorum(kod) {

                                            if (kod >= 61 && kod <= 67) return ["Yağmurlu", "yagmur"];
                                            if (kod >= 71 && kod <= 77) return ["Karlı", "kar"];

    <script>
                                        /* ===== TAKVİM: iPhone görünümü (sağa-sola kaydırmalı aylar) ===== */
                                        const TKC_ILK = 2024, TKC_SON = 2030;
                                        const TKC_N = (TKC_SON - TKC_ILK + 1) * 12;
                                        const TKC_AY = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
                                        const TKC_HARF = ["P", "S", "Ç", "P", "C", "P", "P"];
                                        let tkcIdx = 0, tkcSuru = false;

                                                "<button class='tkc-bug' data-tkc='bugun'>Bugün</button></div>" +

                                                "<div class='tkc-pick' id='tkc-pick'></div></div>";

                                            h += "<div class='tkc-vp' id='tkc-vp'><div class='tkc-track' id='tkc-track'>";
                                            for (let y = TKC_ILK; y <= TKC_SON; y++) {
                                                for (let a = 0; a < 12; a++) {
                                                    const bosluk = (new Date(y, a, 1).getDay() + 6) % 7;
                                                    const sayi = new Date(y, a + 1, 0).getDate();
                                                    const hucre = [];
                                                    for (let i = 0; i < bosluk; i++) hucre.push("<div class='tkc-h bos'></div>");
                                                    for (let g = 1; g <= sayi; g++) {
                                                        const k = tkcAnahtar(y, a, g);
                                                        const liste = harita[k] || [];
                                                        const kol = (bosluk + g - 1) % 7;
                                                        const bugunMu = (y === by && a === bm && g === bg);

                                        // parmakla / fareyle sürükleyerek ay değiştir

                                            p.classList.add("acik");

                                            const c = document.getElementById("tkc-cark");
                                            const ilk = tur === "ay" ? tkcIdx % 12 : Math.floor(tkcIdx / 12);
                                            setTimeout(function () { c.scrollTop = ilk * 36; }, 0);

                                            let z;
                                            c.addEventListener("scroll", function () {

                                                    const i = Math.max(0, Math.min(liste.length - 1, Math.round(c.scrollTop / 36)));

                                            // fareyle sürükleyerek de kaydırılsın
                                            c.addEventListener("pointerdown", function (e) {
                                                if (e.pointerType !== "mouse") return;
                                                const olcek = (c.getBoundingClientRect().height / c.offsetHeight) || 1;
                                                const y0 = e.clientY, s0 = c.scrollTop;
                                                c.style.scrollSnapType = "none";
                                                tkcSuru = false;
                                                function tasi(ev) {
                                                    const d = (y0 - ev.clientY) / olcek;
                                                    if (Math.abs(d) > 4) tkcSuru = true;
                                                    c.scrollTop = s0 + d;
                                                }
                                                function bitir() {
                                                    window.removeEventListener("pointermove", tasi);
                                                    window.removeEventListener("pointerup", bitir);
                                                    const i = Math.max(0, Math.min(liste.length - 1, Math.round(c.scrollTop / 36)));

                                                    c.scrollTo({ top: i * 36, behavior: "smooth" });
                                                    setTimeout(function () { tkcSuru = false; }, 60);

                                                window.addEventListener("pointerup", bitir);
                                            });

                                        function tkcSheetAc(k) {
